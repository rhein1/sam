global:
  imageTag: local
  imagePullPolicy: IfNotPresent

controlPlane:
  replicaCount: 2
  image:
    repository: sam-control-plane
  logLevel: info
  # Leave empty to auto-generate a random admin token on first install (kept
  # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
  adminToken: ""
  autoApproveEnrollment: true
  # Only skips TLS verification for the OIDC issuer; leave false unless
  # pointing at a local/dev issuer without a valid certificate.
  insecureSkipTlsVerify: false
  oidcIssuer: "http://sam-mesh-dex:5556/dex"
  allowedAudiences: "sam-mesh-audience,sam-control-plane-audience"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

database:
  type: postgres
  postgres:
    deployInternal: true
    image:
      repository: postgres
      tag: 16-alpine
    user: sam
    # Leave empty to auto-generate a random password on first install (kept
    # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
    password: ""
    database: sam_mesh
    port: 5432
    sslmode: disable
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

router:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
  image:
    repository: sam-router
  useOidcToken: false
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 4501
    nodePort: null

console:
  enabled: true
  replicaCount: 1
  image:
    repository: sam-console
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8081
    nodePort: null

dex:
  enabled: false
  nodePort: 30556
  image:
    repository: dexidp/dex
    tag: v2.39.0
  google:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""
  cliOAuthSecret: ""

bootstrap:
  bindings: []

